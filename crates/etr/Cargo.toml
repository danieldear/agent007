[package]
name = "agent007-etr"
version = "0.7.0"
edition = "2021"

[features]
# The code-graph tools (graph build, symbol lookup, callers, dependency paths)
# use agent007-core; without them ETR is a small standalone tool runtime.
default = ["graph"]
graph = ["dep:agent007-core"]

[dependencies]
agent007-core = { path = "../core", optional = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
chrono      = { workspace = true }
tracing     = { workspace = true }
globset     = { workspace = true }
uuid        = { workspace = true }
# L1 tool deps
regex       = "1"
csv         = "1"
evalexpr    = "12"
similar     = { version = "2", features = ["text"] }
sha2        = "0.10"
hex         = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
