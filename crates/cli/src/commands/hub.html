    .pack-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.pack-card{display:flex;min-height:190px;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);padding:15px;background:var(--panel)}.pack-card.installed{border-color:color-mix(in oklch,var(--primary) 40%,var(--line));box-shadow:inset 3px 0 0 var(--primary)}.pack-head{display:flex;align-items:flex-start;gap:10px}.pack-mark{display:grid;place-items:center;width:36px;height:36px;flex:0 0 auto;border:1px solid color-mix(in oklch,var(--primary) 40%,var(--line));border-radius:9px;background:var(--primary-soft);color:var(--primary);font:800 10px var(--mono)}.pack-title{min-width:0;flex:1}.pack-name{font-size:14px;font-weight:750}.pack-id{margin-top:2px;color:var(--muted);font:10px var(--mono)}.pack-description{flex:1;margin:13px 0;color:var(--text-2)}.pack-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:13px}.pack-actions{display:flex;flex-wrap:wrap;gap:7px;padding-top:12px;border-top:1px solid var(--line-soft)}
    .empty{padding:42px 24px;text-align:center;color:var(--muted)}.empty-title{margin-bottom:5px;color:var(--text-2);font-weight:700}.error-banner{margin:16px 18px 0;border:1px solid color-mix(in oklch,var(--red) 50%,transparent);border-radius:8px;padding:10px 12px;background:color-mix(in oklch,var(--red) 9%,transparent);color:var(--red)}.hidden{display:none!important}.skeleton{height:34px;margin:7px;border-radius:7px;background:var(--panel-raised);animation:pulse 1.2s ease-in-out infinite}code{font-family:var(--mono);color:var(--text-2)}.toast{position:fixed;z-index:50;right:22px;bottom:22px;max-width:380px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--panel-raised);box-shadow:0 16px 50px rgba(0,0,0,.28);color:var(--text)}.toast.error{border-color:var(--red);color:var(--red)}
    @keyframes pulse{50%{opacity:.45}} @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    @media(max-width:1050px){.app{grid-template-columns:56px 248px minmax(0,1fr)}.project-layout{grid-template-columns:1fr}.inspector{position:static}.asset-shell{grid-template-columns:260px minmax(0,1fr)}.form-grid{grid-template-columns:1fr 120px}.form-grid>div:last-child{grid-column:1/-1}.content{padding:18px}}
    @media(max-width:720px){html,body{overflow:auto}.app{grid-template-columns:1fr;grid-template-rows:52px auto minmax(600px,1fr);height:auto;min-height:100%}.rail{position:sticky;top:0;z-index:20;flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid var(--line);padding:5px}.brand,.rail-spacer,.connection{display:none}.explorer{max-height:300px;border-right:0;border-bottom:1px solid var(--line)}.workspace{min-height:700px}.asset-shell{grid-template-columns:1fr}.asset-master{max-height:270px;border-right:0;border-bottom:1px solid var(--line)}.asset-list{max-height:210px}.metrics{display:grid;grid-template-columns:repeat(2,1fr)}.metric:nth-child(2){border-right:0}.page-header{flex-direction:column}.theme-select{width:98px}.sync-time{display:none}.form-grid{grid-template-columns:1fr}.form-grid>div:last-child{grid-column:auto}.editor-head{flex-direction:column}.editor-actions{width:100%;flex-wrap:wrap}}
  </style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Hub sections">
    <div class="brand" aria-label="agent007">007</div>
    <button class="rail-button active" data-view="projects" aria-label="Projects" title="Projects"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/><path d="M3 7V5h7l2 2"/></svg><span class="count" id="project-count">0</span></button>
    <button class="rail-button" data-view="skills" aria-label="Global skills" title="Global skills"><svg viewBox="0 0 24 24"><path d="m12 3 2.2 4.5L19 8.2l-3.5 3.4.8 4.8-4.3-2.3-4.3 2.3.8-4.8L5 8.2l4.8-.7z"/></svg><span class="count" id="skill-count">0</span></button>
    <button class="rail-button" data-view="workflows" aria-label="Global workflows" title="Global workflows"><svg viewBox="0 0 24 24"><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="12" cy="19" r="2"/><path d="M7 5h10M6 7l5 10m7-10-5 10"/></svg><span class="count" id="workflow-count">0</span></button>
    <button class="rail-button" data-view="personas" aria-label="Global personas" title="Global personas"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="count" id="persona-count">0</span></button>
    <button class="rail-button" data-view="packs" aria-label="Domain packs" title="Domain packs"><svg viewBox="0 0 24 24"><path d="m12 3 8 4-8 4-8-4z"/><path d="m4 11 8 4 8-4M4 15l8 4 8-4"/></svg><span class="count" id="pack-count">0</span></button>
    <button class="rail-button" data-view="memory" aria-label="Memory" title="Memory"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></button>
    <div class="rail-spacer"></div>
    <button class="rail-button" data-view="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></svg></button>
    <span class="connection" id="connection" title="Connecting"></span>
  </nav>
  <aside class="explorer" aria-label="Project explorer">
    <div class="explorer-header"><div class="explorer-title">Projects & threads</div><button class="icon-button" id="collapse-all" aria-label="Collapse all">−</button></div>
    <div class="explorer-search"><input class="search" id="tree-search" type="search" placeholder="Filter projects and threads"></div>
    <div class="project-tree" id="project-tree" role="tree"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    <div class="explorer-footer"><span id="explorer-status">Connecting to local Hub…</span></div>
  </aside>
  <main class="workspace">
    <div class="topbar"><div class="breadcrumbs"><span class="crumb-muted">Hub</span><span class="crumb-muted">/</span><span class="crumb-current" id="breadcrumb">Projects</span></div><div class="topbar-spacer"></div><span class="sync-time" id="sync-time">Connecting…</span><select class="theme-select" id="theme-select" aria-label="Theme"><option value="night">🌙 Night</option><option value="forest">🌿 Forest</option><option value="ocean">🌊 Ocean</option><option value="aurora">✨ Aurora</option><option value="day">☀️ Day</option><option value="corporate">💼 Corporate</option></select><button class="refresh-button" id="refresh">Refresh</button></div>
    <div class="error-banner hidden" id="error" role="alert"></div>
    <div class="workspace-scroll"><div class="content" id="content"><div class="skeleton"></div><div class="skeleton"></div></div></div>
  </main>
</div>
<div class="toast hidden" id="toast" role="status"></div>
<script>
  const token = document.querySelector('meta[name="agent007-hub-token"]').content;
  const assetViews = ['skills','workflows','personas'];
  const state = {data:null,packs:null,packsLoading:false,packsError:null,packSearch:'',packDetails:null,packDetailsLoading:false,view:'projects',projectId:null,threadId:null,filter:'all',treeSearch:'',assetSearch:'',projectsRootExpanded:true,treeInitialized:false,expanded:new Set(),assetId:null,assetDoc:null,assetDraft:'',assetDirty:false,assetCreating:false,assetLoading:false,assetValidation:null,assetBump:'patch',credentialDirty:false};
  const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const statusLabel = v => ({ready:'Ready',needs_init:'Needs init',missing:'Missing',running:'Running','awaiting-approval':'Approval',succeeded:'Succeeded',failed:'Failed'}[v]||v||'Unknown');
  const relativeTime = v => {const d=Math.max(0,Date.now()-new Date(v).getTime()),m=Math.floor(d/60000);if(m<1)return'now';if(m<60)return`${m}m`;const h=Math.floor(m/60);return h<24?`${h}h`:`${Math.floor(h/24)}d`};
  const bytes = v => {const n=Number(v||0);return n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`};
  const providerShort = v => /codex|openai|gpt/i.test(v)?'OA':/claude|anthropic/i.test(v)?'AN':/ollama|llama/i.test(v)?'OL':/host/i.test(v)?'HM':String(v||'??').slice(0,2).toUpperCase();
  const kindSingular = kind => ({skills:'skill',workflows:'workflow',personas:'persona'}[kind]);
  const kindCode = kind => ({skills:'SK',workflows:'WF',personas:'PS'}[kind]);

  function showToast(message,error=false){const el=document.getElementById('toast');el.textContent=message;el.classList.toggle('error',error);el.classList.remove('hidden');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.add('hidden'),3500)}
  async function api(url,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(options.method&&options.method!=='GET')headers['X-Agent007-Hub-Token']=token;const response=await fetch(url,{cache:'no-store',...options,headers});const payload=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(payload.message||`${response.status} ${response.statusText}`);error.status=response.status;error.details=payload.errors||[];throw error}return payload}

  async function loadHub(renderWorkspace=true){const error=document.getElementById('error');try{const data=await api('/api/hub');state.data=data;if(!state.projectId&&data.projects.length)state.projectId=data.projects[0].id;if(!state.treeInitialized){if(state.projectId)state.expanded.add(state.projectId);state.treeInitialized=true}error.classList.add('hidden');document.getElementById('connection').classList.add('ok');document.getElementById('connection').title='Hub connected';const preserveWorkspace=assetViews.includes(state.view)&&state.assetDirty||state.view==='settings'&&state.credentialDirty;render(renderWorkspace&&!preserveWorkspace)}catch(err){document.getElementById('connection').classList.remove('ok');error.textContent=`Could not refresh the Hub: ${err.message}`;error.classList.remove('hidden')}}
  async function loadPacks(){if(state.packsLoading)return;state.packsLoading=true;state.packsError=null;renderPacks();try{state.packs=await api('/api/packs');document.getElementById('pack-count').textContent=state.packs.packs.length}catch(err){state.packsError=err.message}finally{state.packsLoading=false;renderPacks()}}
  function render(workspace=true){if(!state.data)return;const d=state.data;document.getElementById('project-count').textContent=d.projects.length;document.getElementById('skill-count').textContent=d.assets.skills.length;document.getElementById('workflow-count').textContent=d.assets.workflows.length;document.getElementById('persona-count').textContent=d.assets.personas.length;document.getElementById('pack-count').textContent=state.packs?.packs?.length||0;document.getElementById('sync-time').textContent=`Updated ${new Date(d.generated_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;document.getElementById('explorer-status').textContent=`${d.summary.projects} projects · ${d.summary.threads} recent threads · ${d.summary.active_threads} active`;document.querySelectorAll('.rail-button[data-view]').forEach(b=>{const active=b.dataset.view===state.view;b.classList.toggle('active',active);active?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});renderTree();if(workspace)renderWorkspace()}
  function renderTree(){
    const q=state.treeSearch.trim().toLowerCase(),root=document.getElementById('project-tree');
    const projects=state.data.projects.filter(p=>!q||p.name.toLowerCase().includes(q)||p.path.toLowerCase().includes(q)||p.threads.some(t=>t.task.toLowerCase().includes(q)||t.provider.toLowerCase().includes(q)));
    if(!projects.length){root.innerHTML='<div class="empty"><div class="empty-title">No matching projects</div>Try another filter.</div>';return}
    const rootOpen=Boolean(q)||state.projectsRootExpanded;
    const projectMarkup=rootOpen?projects.map(p=>{
      const open=Boolean(q)||state.expanded.has(p.id),selected=state.view==='projects'&&state.projectId===p.id&&!state.threadId;
      const visible=p.threads.filter(t=>!q||t.task.toLowerCase().includes(q)||t.provider.toLowerCase().includes(q)).slice(0,9);
      const threads=visible.map(t=>`<button class="tree-row thread-row ${state.threadId===t.id?'selected':''}" role="treeitem" aria-level="3" aria-selected="${state.threadId===t.id}" data-action="thread" data-project="${escapeHtml(p.id)}" data-thread="${escapeHtml(t.id)}"><span class="status-dot ${escapeHtml(t.status)}"></span><span class="thread-copy"><span class="thread-title">${escapeHtml(t.task)}</span><span class="thread-provider">${escapeHtml(t.provider)} · ${escapeHtml(t.mode)}</span></span><span class="tree-meta">${relativeTime(t.started_at)}</span></button>`).join('');
      const childMarkup=open?`<div class="project-children" role="group"><div class="thread-group-heading">Threads in ${escapeHtml(p.name)}</div>${threads||'<div class="tree-more">No threads recorded for this project</div>'}${p.thread_count>visible.length?`<div class="tree-more">${p.thread_count-visible.length} more in ${escapeHtml(p.name)}</div>`:''}</div>`:'';
      return`<div class="tree-project"><button class="tree-row project-row ${selected?'selected':''}" role="treeitem" aria-level="2" aria-expanded="${open}" aria-selected="${selected}" data-action="project" data-project="${escapeHtml(p.id)}"><span class="chevron ${open?'open':''}">›</span><span class="folder-icon" aria-hidden="true"></span><span class="status-dot ${escapeHtml(p.health.status)}"></span><span class="tree-label">${escapeHtml(p.name)}</span><span class="project-thread-count">${p.thread_count} thread${p.thread_count===1?'':'s'}</span></button>${childMarkup}</div>`;
    }).join(''):'';
    root.innerHTML=`<button class="tree-row tree-root-row" role="treeitem" aria-level="1" aria-expanded="${rootOpen}" data-action="projects-root"><span class="chevron ${rootOpen?'open':''}">›</span><span class="folder-icon" aria-hidden="true"></span><span class="tree-label">Projects</span><span class="tree-count">${projects.length}</span></button>${rootOpen?`<div class="tree-root-children" role="group">${projectMarkup}</div>`:''}`;
  }
  function renderWorkspace(){const labels={projects:'Projects',skills:'Global skills',workflows:'Global workflows',personas:'Global personas',packs:'Domain packs',memory:'Memory',settings:'Settings'};document.getElementById('breadcrumb').textContent=labels[state.view];if(state.view==='projects')return renderProject();if(assetViews.includes(state.view))return renderAssets(state.view);if(state.view==='packs')return renderPacks();if(state.view==='memory')return renderMemory();renderSettings()}
  function renderProject(){const p=state.data.projects.find(x=>x.id===state.projectId)||state.data.projects[0],content=document.getElementById('content');if(!p){content.innerHTML='<div class="empty"><div class="empty-title">No projects registered</div><code>agent007 projects add &lt;path&gt;</code></div>';return}state.projectId=p.id;const selected=p.threads.find(t=>t.id===state.threadId)||p.threads[0]||null;if(selected&&!state.threadId)state.threadId=selected.id;const filtered=p.threads.filter(t=>state.filter==='all'||(state.filter==='active'&&['running','awaiting-approval'].includes(t.status))||(state.filter==='failed'&&t.status==='failed'));const rows=filtered.map(t=>`<button class="thread-item ${selected?.id===t.id?'selected':''}" data-action="thread-main" data-thread="${escapeHtml(t.id)}"><span class="status-dot ${escapeHtml(t.status)}"></span><span class="thread-main"><span class="thread-task">${escapeHtml(t.task)}</span><span class="thread-details"><span>${escapeHtml(t.provider)}</span><span>·</span><span>${escapeHtml(t.mode)}</span><span>·</span><span>${escapeHtml(t.kind)}</span></span></span><span class="thread-time">${relativeTime(t.started_at)}</span></button>`).join('');const inspector=selected?`<section class="section inspector"><div class="section-header"><span class="section-title">Thread inspector</span><span class="section-spacer"></span><span class="badge ${escapeHtml(selected.status)}">${escapeHtml(statusLabel(selected.status))}</span></div><div class="inspector-body"><div class="inspector-task">${escapeHtml(selected.task)}</div><div class="kv"><span class="kv-key">Provider</span><span class="kv-value">${escapeHtml(selected.provider)}</span></div><div class="kv"><span class="kv-key">Runtime</span><span class="kv-value">${escapeHtml(selected.mode)}</span></div><div class="kv"><span class="kv-key">Kind</span><span class="kv-value">${escapeHtml(selected.kind)}</span></div><div class="kv"><span class="kv-key">Started</span><span class="kv-value">${escapeHtml(new Date(selected.started_at).toLocaleString())}</span></div><div class="kv"><span class="kv-key">Thread ID</span><span class="kv-value">${escapeHtml(selected.id)}</span></div>${selected.output_preview?`<div class="preview">${escapeHtml(selected.output_preview)}</div>`:''}</div></section>`:'<section class="section inspector"><div class="empty"><div class="empty-title">No recorded threads</div>Threads appear here after agent007 records work from any provider.</div></section>';content.innerHTML=`<div class="page-header"><div class="page-heading"><h1>${escapeHtml(p.name)}</h1><div class="page-subtitle">${escapeHtml(p.path)}</div></div><div class="page-actions"><span class="badge ${escapeHtml(p.health.status)}">${escapeHtml(statusLabel(p.health.status))}</span>${p.dashboard_url?`<a class="button primary" href="${escapeHtml(p.dashboard_url)}" target="_blank" rel="noreferrer">Open dashboard</a>`:'<span class="badge muted">Dashboard stopped</span>'}</div></div><div class="metrics"><div class="metric"><div class="metric-label">Recent threads</div><div class="metric-value">${p.thread_count}</div></div><div class="metric"><div class="metric-label">Active</div><div class="metric-value">${p.active_thread_count}</div></div><div class="metric"><div class="metric-label">Runtime</div><div class="metric-value">${p.dashboard_port?'Live':'Idle'}</div></div><div class="metric"><div class="metric-label">Config</div><div class="metric-value">${p.health.config_present?'Ready':'Missing'}</div></div></div><div class="project-layout"><section class="section"><div class="section-header"><span class="section-title">Thread activity</span><span class="section-meta">provider-agnostic</span><span class="section-spacer"></span><div class="filters">${['all','active','failed'].map(f=>`<button class="filter-button ${state.filter===f?'active':''}" data-filter="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div></div>${rows||'<div class="empty"><div class="empty-title">No threads in this filter</div>Select All to see recent activity.</div>'}</section>${inspector}</div>`}

  function renderAssets(kind){const plural={skills:'skills',workflows:'workflows',personas:'personas'}[kind],query=state.assetSearch.toLowerCase(),items=state.data.assets[kind].filter(x=>!query||x.name.toLowerCase().includes(query)||x.description.toLowerCase().includes(query)||x.id.toLowerCase().includes(query)||(x.pack_id||'').toLowerCase().includes(query));const rows=items.map(x=>`<button class="asset-row ${!state.assetCreating&&state.assetId===x.id?'selected':''}" data-asset-id="${escapeHtml(x.id)}"><span class="asset-row-top"><span class="asset-kind">${kindCode(kind)}</span><span class="asset-copy"><span class="asset-title-line"><span class="asset-name">${escapeHtml(x.name)}</span><span class="asset-version">v${escapeHtml(x.version)}</span></span><span class="asset-row-meta">${x.source==='pack'?`<span class="badge muted">Pack · ${escapeHtml(x.pack_id||'')}</span>`:''}${x.valid?'':'<span class="badge invalid">Needs repair</span>'}</span></span></span><span class="asset-description">${escapeHtml(x.description||`Global ${kindSingular(kind)}`)}</span></button>`).join('');document.getElementById('content').innerHTML=`<div class="page-header"><div class="page-heading"><h1>Global ${plural}</h1><div class="page-subtitle">User-managed global assets and active assets supplied by enabled domain packs.</div></div><div class="page-actions"><span class="badge valid">Global assets editable</span><span class="badge muted">Pack assets read-only</span><button class="button primary" id="new-asset">+ New ${kindSingular(kind)}</button></div></div><div class="asset-shell"><aside class="asset-master"><div class="asset-toolbar"><input class="search" id="asset-search" type="search" value="${escapeHtml(state.assetSearch)}" placeholder="Search ${plural} or packs"><span class="section-meta">${items.length}</span></div><div class="asset-list">${rows||'<div class="empty"><div class="empty-title">No matching assets</div>Create one or adjust the search.</div>'}</div></aside><section class="asset-editor" id="asset-editor">${renderEditor(kind)}</section></div><div class="notice" style="margin-top:16px"><span class="notice-icon">✓</span><div><strong>Runtime catalog view.</strong> Global assets can be edited safely here. Pack-provided assets are verified, read-only, and managed from Domain packs so local edits cannot bypass package integrity.</div></div>`;bindAssetEvents(kind);if(!state.assetDoc&&!state.assetCreating&&!state.assetLoading&&items.length)queueMicrotask(()=>loadAsset(kind,items[0].id,true))}
  function renderEditor(kind){if(state.assetLoading)return'<div class="editor-empty"><div><div class="empty-title">Loading asset…</div>Reading the latest revision.</div></div>';if(!state.assetDoc&&!state.assetCreating)return'<div class="editor-empty"><div><div class="empty-title">Select an asset</div>Edit global source or inspect a read-only pack asset.</div></div>';const doc=state.assetDoc||{},creating=state.assetCreating,readOnly=!creating&&doc.editable===false,validation=state.assetValidation;const validationHtml=readOnly?`<div class="validation valid"><span>✓</span><div><strong>Verified pack asset</strong><div class="section-meta">Provided by ${escapeHtml(doc.pack_id||'domain pack')} ${doc.pack_version?`· v${escapeHtml(doc.pack_version)}`:''}. Manage installation and activation from Domain packs.</div></div></div>`:validation?`<div class="validation ${validation.valid?'valid':'invalid'}"><span>${validation.valid?'✓':'!'}</span><div><strong>${validation.valid?'Source is valid':'Validation failed'}</strong>${validation.errors?.length?`<ul>${validation.errors.map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul>`:`<div class="section-meta">${escapeHtml(validation.name||'')} ${validation.version?`· v${escapeHtml(validation.version)}`:''}</div>`}</div></div>`:'<div class="validation"><span>i</span><div><strong>Validation pending</strong><div class="section-meta">Validate before saving. Saving always validates again on the server.</div></div></div>';return`<div class="editor-head"><div class="editor-title"><div class="editor-name">${creating?`New global ${kindSingular(kind)}`:escapeHtml(doc.name)}</div><div class="editor-meta"><span>${escapeHtml(doc.format||defaultFormat(kind))}</span><span>·</span><span>${creating?'starts at v1.0.0':`v${escapeHtml(doc.version)}`}</span>${readOnly?`<span>·</span><span>pack ${escapeHtml(doc.pack_id||'')}</span>`:!creating&&doc.revision?`<span>·</span><span>rev ${escapeHtml(doc.revision.slice(0,10))}</span>`:''}<span class="unsaved ${state.assetDirty?'':'hidden'}" id="unsaved-label">Unsaved</span></div></div><div class="editor-actions">${readOnly?'<button class="button" id="manage-pack">Manage pack</button>':`<button class="button" id="validate-asset">Validate</button>${creating?'':`<button class="button danger" id="delete-asset">Delete</button>`}<button class="button primary" id="save-asset">${creating?'Create':'Save'}</button>`}</div></div><div class="editor-body"><div class="form-grid"><div><label class="label" for="asset-id">Asset ID</label><input class="field" id="asset-id" value="${escapeHtml(creating?(doc.id||''):doc.id)}" ${creating?'placeholder="lowercase-id"':'readonly'}></div><div><label class="label" for="asset-format">Format</label><input class="field" id="asset-format" value="${escapeHtml(doc.format||defaultFormat(kind))}" readonly></div><div><label class="label" for="asset-bump">Version bump</label><select class="select" id="asset-bump" ${creating||readOnly?'disabled':''}><option value="none" ${state.assetBump==='none'?'selected':''}>No bump</option><option value="patch" ${state.assetBump==='patch'?'selected':''}>Patch</option><option value="minor" ${state.assetBump==='minor'?'selected':''}>Minor</option><option value="major" ${state.assetBump==='major'?'selected':''}>Major</option></select></div></div><label class="label" for="asset-source">Source</label><textarea class="source-editor" id="asset-source" spellcheck="false" ${readOnly?'readonly':''}>${escapeHtml(state.assetDraft)}</textarea>${validationHtml}</div>`}
  function bindAssetEvents(kind){document.getElementById('asset-search')?.addEventListener('input',e=>{state.assetSearch=e.target.value;renderAssets(kind);const input=document.getElementById('asset-search');input?.focus();input?.setSelectionRange(input.value.length,input.value.length)});document.querySelectorAll('[data-asset-id]').forEach(b=>b.addEventListener('click',()=>loadAsset(kind,b.dataset.assetId)));document.getElementById('new-asset')?.addEventListener('click',()=>newAsset(kind));bindEditorEvents(kind)}

  function defaultFormat(kind){return kind==='skills'?'md':kind==='workflows'?'yaml':'toml'}
  function templateFor(kind){if(kind==='skills')return`---\nname: New Skill\ndescription: Describe what this skill does\ntrigger: /new-skill\nversion: "1.0.0"\n---\n\nYou are an expert assistant. Define the skill instructions here.\n`;if(kind==='workflows')return`name: new-workflow\nversion: "1.0.0"\ndescription: Describe this workflow\nsteps:\n  - id: first_step\n    agent: Coder\n    prompt: |\n      Complete the requested task: {{task}}\n    output: result\n`;return`name = "New Persona"\nversion = "1.0.0"\ndescription = "Describe this persona"\npreferred_model = "codex"\nallowed_tools = []\nsystem_prompt = """\nYou are a focused expert. Define the persona behavior here.\n"""\n`}
  function confirmDiscard(){return !state.assetDirty||confirm('Discard your unsaved changes?')}
  async function loadAsset(kind,id,force=false){if(!force&&!confirmDiscard())return;state.assetLoading=true;state.assetCreating=false;state.assetId=id;state.assetDoc=null;state.assetDirty=false;state.assetValidation=null;renderAssets(kind);try{const doc=await api(`/api/assets/${kind}/${encodeURIComponent(id)}`);state.assetDoc=doc;state.assetDraft=doc.content;state.assetId=doc.id;state.assetValidation={valid:doc.valid,errors:doc.validation_errors||[],name:doc.name,version:doc.version};state.assetBump='patch'}catch(err){showToast(`Could not load asset: ${err.message}`,true);state.assetId=null}finally{state.assetLoading=false;renderAssets(kind)}}

  async function validateAsset(kind,notify){try{const result=await api(`/api/assets/${kind}/validate`,{method:'POST',body:JSON.stringify({format:state.assetDoc?.format||defaultFormat(kind),content:state.assetDraft})});state.assetValidation=result;const container=document.getElementById('asset-editor');if(container){container.innerHTML=renderEditor(kind);bindEditorEvents(kind)}if(notify)showToast(result.valid?'Asset source is valid':result.errors.join('; '),!result.valid);return result.valid}catch(err){showToast(`Validation failed: ${err.message}`,true);return false}}
  async function saveAsset(kind){const valid=await validateAsset(kind,false);if(!valid){showToast('Fix validation errors before saving.',true);return}const button=document.getElementById('save-asset');if(button)button.disabled=true;try{let doc;if(state.assetCreating){const id=(state.assetDoc.id||'').trim();if(!id){showToast('Enter an asset ID.',true);return}doc=await api(`/api/assets/${kind}`,{method:'POST',body:JSON.stringify({id,format:state.assetDoc.format,content:state.assetDraft})})}else{doc=await api(`/api/assets/${kind}/${encodeURIComponent(state.assetDoc.id)}`,{method:'PUT',body:JSON.stringify({expected_revision:state.assetDoc.revision,bump:state.assetBump,content:state.assetDraft})})}state.assetDoc=doc;state.assetDraft=doc.content;state.assetId=doc.id;state.assetCreating=false;state.assetDirty=false;state.assetValidation={valid:true,errors:[],name:doc.name,version:doc.version};state.assetBump='patch';await loadHub(false);renderAssets(kind);showToast(`${doc.name} saved as v${doc.version}.`)}catch(err){showToast(err.status===409?'This asset changed elsewhere. Reload it before saving.':`Save failed: ${err.message}`,true)}finally{if(button)button.disabled=false}}

  function renderPacks(){

    const content=document.getElementById('content');

    }).join('');

    content.innerHTML=`<div class="page-header"><div class="page-heading"><h1>Domain packs</h1><div class="page-subtitle">Discover, verify, install, and activate optional capability bundles from the agent007 registry.</div></div><div class="page-actions"><span class="badge ${inventory.from_cache?'muted':'valid'}">${inventory.from_cache?'Cached registry':'Registry verified'}</span><button class="button" id="refresh-packs">Refresh registry</button></div></div><div class="metrics"><div class="metric"><div class="metric-label">Published</div><div class="metric-value">${inventory.packs.length}</div></div><div class="metric"><div class="metric-label">Installed</div><div class="metric-value">${installed}</div></div><div class="metric"><div class="metric-label">Enabled</div><div class="metric-value">${enabled}</div></div><div class="metric"><div class="metric-label">Updates</div><div class="metric-value">${updates}</div></div></div>${detail}<div class="asset-toolbar"><input class="search" id="pack-search" type="search" value="${escapeHtml(state.packSearch)}" placeholder="Search packs, categories, or capabilities"><span class="section-meta">${visiblePacks.length} shown · global scope</span></div><section class="pack-grid">${cards||`<div class="empty"><div class="empty-title">${inventory.packs.length?'No matching packs':'No packs published'}</div>${inventory.packs.length?'Try another search.':'The registry is reachable but currently empty.'}</div>`}</section><div class="notice" style="margin-top:18px"><span class="notice-icon">✓</span><div><strong>Verified before activation.</strong> agent007 checks the registry schema, semantic-version compatibility, manifest and artifact SHA-256 digests, and every bundle entry before atomically activating a version. Hub manages global packs; use <code>agent007 pack --scope project</code> for a project-only install.</div></div><div class="section-meta" style="margin-top:10px">Registry: ${escapeHtml(inventory.registry)}</div>`;

  function renderPackDetails(detail){const m=detail.manifest,c=m.contents,p=m.permissions,deps=m.dependencies?.packs||[];return`<section class="section"><div class="section-header"><span class="section-title">${escapeHtml(m.pack.name)} ${escapeHtml(m.pack.version)}</span><span class="section-meta">verified manifest</span><span class="section-spacer"></span><button class="button" id="close-pack-details">Close</button></div><div class="inspector-body"><div class="kv"><span class="kv-key">Contents</span><span class="kv-value">${c.skills.length} skills · ${c.workflows.length} workflows · ${c.personas.length} personas · ${c.tools.length} tools</span></div><div class="kv"><span class="kv-key">Network</span><span class="kv-value">${p.network?'Requested':'Not requested'}</span></div><div class="kv"><span class="kv-key">External actions</span><span class="kv-value">${p.external_actions?'Declared — explicit CLI approval required':'Not declared'}</span></div><div class="kv"><span class="kv-key">Approval gates</span><span class="kv-value">${escapeHtml(p.approval_required.join(', ')||'None')}</span></div><div class="kv"><span class="kv-key">Dependencies</span><span class="kv-value">${escapeHtml(deps.map(d=>`${d.id} ${d.version}`).join(', ')||'None')}</span></div><div class="kv"><span class="kv-key">License</span><span class="kv-value">${escapeHtml(m.pack.license)}</span></div></div></section>`}

  }

  function renderMemory(){const m=state.data.memory,groups=m.storage_groups.map(g=>`<span class="memory-chip">${escapeHtml(g)}</span>`).join('');document.getElementById('content').innerHTML=`<div class="page-header"><div class="page-heading"><h1>Global memory</h1><div class="page-subtitle">Storage and namespace inventory for reusable agent007 context.</div></div><span class="badge muted">Inventory only</span></div><div class="metrics"><div class="metric"><div class="metric-label">Database</div><div class="metric-value">${m.database_present?'Online':'Missing'}</div></div><div class="metric"><div class="metric-label">Database size</div><div class="metric-value">${bytes(m.database_size_bytes)}</div></div><div class="metric"><div class="metric-label">Storage groups</div><div class="metric-value">${m.storage_groups.length}</div></div></div><section class="section"><div class="section-header"><span class="section-title">Storage groups</span></div><div class="memory-groups">${groups||'<span class="section-meta">No filesystem-backed groups found.</span>'}</div></section><div class="notice"><span class="notice-icon">i</span><div><strong>Memory mutation remains intentionally separate.</strong> Asset editing is live; memory needs namespace-aware search, export, expiry, and audited deletion.</div></div>`}
  function renderSettings(){

      return`<article class="provider-card"><div class="provider-head"><span class="provider-logo">${providerShort(p.name)}</span><span class="provider-title">${escapeHtml(p.name)}</span><span class="badge ${p.configured?'configured':'muted'}">${p.configured?'Configured':'Not configured'}</span></div><div class="provider-detail">${escapeHtml(p.detail)}</div><div class="provider-source">source: ${escapeHtml(p.source)}</div>${manager}</article>`;
    }).join('');
    document.getElementById('content').innerHTML=`<div class="page-header"><div class="page-heading"><h1>Settings</h1><div class="page-subtitle">Provider credentials, readiness, theme, security posture, and Hub behavior.</div></div><span class="badge valid">Keychain protected</span></div><section class="section"><div class="section-header"><span class="section-title">Model providers</span><span class="section-meta">manage credentials and readiness</span></div><div style="padding:12px"><div class="provider-grid">${cards}</div></div></section><section class="section"><div class="section-header"><span class="section-title">Security contract</span></div><div class="inspector-body"><div class="kv"><span class="kv-key">Binding</span><span class="kv-value">127.0.0.1 only</span></div><div class="kv"><span class="kv-key">API keys</span><span class="kv-value">macOS Keychain; values are write-only in the Hub</span></div><div class="kv"><span class="kv-key">Precedence</span><span class="kv-value">environment variables override Keychain credentials</span></div><div class="kv"><span class="kv-key">Asset edits</span><span class="kv-value">versioned, revision-checked, validated, backed up</span></div><div class="kv"><span class="kv-key">Deletes</span><span class="kv-value">typed confirmation + recoverable trash</span></div><div class="kv"><span class="kv-key">Process control</span><span class="kv-value">disabled until supervised child ownership exists</span></div></div></section><div class="notice"><span class="notice-icon">i</span><div><strong>Stored keys are write-only.</strong> You can set, rotate, or remove a key here, but the Hub API never returns its value. Model-provider clients read saved credentials directly when the matching environment variable is absent; unrelated child tools do not inherit them.</div></div>`;

  async function saveCredential(provider,form){const input=form.querySelector('input[type="password"]'),button=form.querySelector('button[type="submit"]'),apiKey=input?.value.trim();if(!apiKey){showToast('Enter an API key before saving.',true);input?.focus();return}if(button)button.disabled=true;if(input)input.value='';state.credentialDirty=false;try{await api(`/api/credentials/${encodeURIComponent(provider)}`,{method:'PUT',body:JSON.stringify({api_key:apiKey})});await loadHub(false);renderSettings();showToast(`${provider==='openai'?'OpenAI':'Anthropic'} key saved to macOS Keychain.`)}catch(err){showToast(`Credential save failed: ${err.message}`,true)}finally{if(button)button.disabled=false}}
  async function removeCredential(provider){if(!confirm(`Remove the ${provider==='openai'?'OpenAI':'Anthropic'} key from macOS Keychain?`))return;try{await api(`/api/credentials/${encodeURIComponent(provider)}`,{method:'DELETE'});state.credentialDirty=false;await loadHub(false);renderSettings();showToast(`${provider==='openai'?'OpenAI':'Anthropic'} Keychain credential removed.`)}catch(err){showToast(`Credential removal failed: ${err.message}`,true)}}
  function confirmCredentialDiscard(){if(!state.credentialDirty)return true;if(!confirm('Discard the API key you have not saved?'))return false;state.credentialDirty=false;return true}

  document.querySelector('.rail').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;if(assetViews.includes(state.view)&&state.assetDirty&&!confirmDiscard()||state.view==='settings'&&!confirmCredentialDiscard())return;state.view=b.dataset.view;state.threadId=null;state.assetSearch='';state.assetId=null;state.assetDoc=null;state.assetDraft='';state.assetDirty=false;state.assetCreating=false;state.assetValidation=null;render()});
  document.getElementById('project-tree').addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;if(t.dataset.action==='projects-root'){state.projectsRootExpanded=!state.projectsRootExpanded;renderTree();return}const id=t.dataset.project;if(t.dataset.action==='project'){state.view='projects';state.projectId=id;state.threadId=null;state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id)}else{state.view='projects';state.projectId=id;state.threadId=t.dataset.thread;state.expanded.add(id)}render()});
  document.getElementById('content').addEventListener('click',e=>{const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;renderProject();return}const thread=e.target.closest('[data-action="thread-main"]');if(thread){state.threadId=thread.dataset.thread;renderProject();renderTree()}});
  document.getElementById('tree-search').addEventListener('input',e=>{state.treeSearch=e.target.value;renderTree()});document.getElementById('collapse-all').addEventListener('click',()=>{state.projectsRootExpanded=false;state.expanded.clear();renderTree()});document.getElementById('refresh').addEventListener('click',()=>{if(state.view==='packs'){state.packs=null;loadPacks()}loadHub()});
  const themeSelect=document.getElementById('theme-select');themeSelect.value=document.documentElement.dataset.theme;themeSelect.addEventListener('change',e=>{document.documentElement.dataset.theme=e.target.value;localStorage.setItem('theme',e.target.value)});
  window.addEventListener('beforeunload',e=>{if(state.assetDirty||state.credentialDirty){e.preventDefault();e.returnValue=''}});
  loadHub();setInterval(()=>loadHub(),15000);
</script>
</body>
</html>
