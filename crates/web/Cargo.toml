[package]
name = "agent007-web"
version = "0.6.0"
edition = "2021"
build = "build.rs"

[dependencies]
agent007-core       = { path = "../core" }
agent007-extensions = { path = "../extensions" }
agent007-mcp      = { path = "../mcp" }
agent007-learning = { path = "../learning" }
agent007-skills   = { path = "../skills" }
agent007-models   = { path = "../models" }
agent007-memory   = { path = "../memory" }
agent007-personas = { path = "../personas" }
agent007-workflows = { path = "../workflows" }
agent007-etr       = { path = "../etr" }
agent007-sharing   = { path = "../sharing" }
agent007-testing   = { path = "../testing" }
agent007-zones     = { path = "../zones" }
axum              = { workspace = true }
tower             = { workspace = true }
tower-http        = { version = "0.6", features = ["fs"] }
tokio             = { workspace = true }
tokio-util        = { workspace = true }
tokio-stream      = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
serde_yaml        = { workspace = true }
toml             = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }
async-trait       = { workspace = true }
futures           = { workspace = true }
tempfile          = { workspace = true }
chrono            = { workspace = true }
uuid              = { workspace = true }
reqwest           = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha2              = "0.10"
ts-rs             = { version = "10", features = ["serde-compat", "no-serde-warnings"] }
anyhow            = { workspace = true }
base64            = "0.22"
include_dir       = "0.7"
mime_guess        = "2"

[dev-dependencies]
tokio        = { workspace = true }
axum-test = "17"
