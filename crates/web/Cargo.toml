[package]
name = "agent007-web"
version = "0.1.0"
edition = "2021"

[dependencies]
agent007-core     = { path = "../core" }
agent007-learning = { path = "../learning" }
agent007-skills   = { path = "../skills" }
agent007-models   = { path = "../models" }
agent007-memory   = { path = "../memory" }
agent007-personas = { path = "../personas" }
agent007-workflows = { path = "../workflows" }
axum              = { workspace = true }
tower             = { workspace = true }
tower-http        = { version = "0.6", features = ["fs"] }
tokio             = { workspace = true }
tokio-util        = { workspace = true }
tokio-stream      = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
serde_yaml        = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }
async-trait       = { workspace = true }
futures           = { workspace = true }
tempfile          = { workspace = true }
chrono            = { workspace = true }
reqwest           = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
ts-rs             = { version = "10", features = ["serde-compat"] }

[dev-dependencies]
tokio        = { workspace = true }
axum-test = "17"
