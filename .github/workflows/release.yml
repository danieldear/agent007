name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    env:
      CARGO_TERM_COLOR: always
      AGENT007_SKIP_FRONTEND_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crates/web/frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci --prefix crates/web/frontend
          npm run build --prefix crates/web/frontend

      - name: Build binary
        run: cargo build --release --locked -p agent007 --target ${{ matrix.target }}

      - name: Package artifact (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="agent007-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/agent007" dist/agent007
          tar -C dist -czf "$asset" agent007
          shasum -a 256 "$asset" > "$asset.sha256"

      - name: Package artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "agent007-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/agent007.exe" "dist/agent007.exe"
          Compress-Archive -Path "dist/agent007.exe" -DestinationPath $asset -Force
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -FilePath "$asset.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            agent007-${{ matrix.target }}.tar.gz
            agent007-${{ matrix.target }}.zip
            agent007-${{ matrix.target }}.tar.gz.sha256
            agent007-${{ matrix.target }}.zip.sha256

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Assemble checksums and installer
        shell: bash
        run: |
          set -euo pipefail
          find release-artifacts -type f -name '*.sha256' -print0 | sort -z | xargs -0 cat > release-artifacts/SHA256SUMS
          cp scripts/install.sh release-artifacts/install.sh
          chmod +x release-artifacts/install.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/SHA256SUMS
            release-artifacts/install.sh
